<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ESOL Beginner 2 — weekly interactive English practice for adults." />
    <title>ESOL Beginner 2</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐︎</text></svg>" />
    <script>
      // Pick light/dark before the page draws (no flash): saved choice, else the device setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem('esol-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        // Page zoom from the − / + buttons (percent).
        var z = null;
        try { z = Number(localStorage.getItem('esol-page-zoom')); } catch (e) {}
        if (z >= 25 && z <= 200) document.documentElement.style.setProperty('--page-zoom', String(z / 100));
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.jsx"></script>
  </body>
</html>
